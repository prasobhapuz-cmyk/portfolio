<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMono6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradMono6)"/>

  <!-- Mohr's Circle in White Wireframe -->
  <g transform="translate(260, 260)">
    <line x1="-170" y1="0" x2="170" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <circle cx="25" cy="0" r="95" fill="rgba(255,255,255,0.05)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="25" cy="0" r="3" fill="#ffffff"/>

    <line x1="-50" y1="65" x2="100" y2="-65" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="-50" cy="65" r="4" fill="#ffffff"/>
    <circle cx="100" cy="-65" r="4" fill="#ffffff"/>

    <text x="120" y="-10" font-family="'JetBrains Mono', monospace" font-size="10" fill="#86868b">σ (Normal)</text>
    <text x="10" y="-115" font-family="'JetBrains Mono', monospace" font-size="10" fill="#86868b">τ (Shear)</text>
  </g>

  <!-- Python Code Window -->
  <g transform="translate(480, 140)">
    <rect x="0" y="0" width="270" height="230" rx="10" fill="#141416" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#ffffff"/>
    <circle cx="34" cy="18" r="4" fill="rgba(255,255,255,0.5)"/>
    <circle cx="48" cy="18" r="4" fill="rgba(255,255,255,0.2)"/>
    <text x="68" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#86868b">mechanics_solver.py</text>
    <line x1="0" y1="35" x2="270" y2="35" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="15" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff">import numpy as np</text>
    <text x="15" y="86" font-family="'JetBrains Mono', monospace" font-size="10" fill="#86868b">def calc_stress(s_x, s_y, tau):</text>
    <text x="25" y="110" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff">  s_avg = (s_x + s_y) / 2</text>
    <text x="25" y="134" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff">  R = np.hypot(s_x - s_avg, tau)</text>
    <text x="25" y="158" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff">  return s_avg + R, s_avg - R</text>
  </g>

  <text x="60" y="60" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff" font-weight="bold">ENGINEERING MECHANICS COMPUTATIONAL SUITE</text>
  <text x="60" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#86868b">STRESS TENSORS, SFD/BMD &amp; THERMODYNAMICS CALCULATIONS</text>
</svg>
