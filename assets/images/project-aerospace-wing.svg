<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <pattern id="gridMono" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradMono)"/>
  <rect width="800" height="500" fill="url(#gridMono)"/>

  <!-- Monochrome Aerodynamic Streamlines -->
  <path d="M 50 140 Q 250 120 400 130 T 750 110" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <path d="M 50 180 Q 260 140 420 160 T 750 140" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="8 4"/>
  <path d="M 50 220 Q 280 170 450 210 T 750 200" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
  <path d="M 50 290 Q 300 310 460 280 T 750 270" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <path d="M 50 340 Q 320 370 480 340 T 750 330" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Airfoil Contour (NACA Profile) in Pure White -->
  <path d="M 220 240 C 220 180, 360 160, 520 235 C 570 260, 600 280, 620 285 C 580 295, 480 305, 360 285 C 270 270, 220 260, 220 240 Z" 
        fill="rgba(255,255,255,0.06)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Internal Structural Spars -->
  <line x1="330" y1="180" x2="330" y2="280" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="430" y1="205" x2="430" y2="288" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="510" y1="230" x2="510" y2="287" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 230 240 Q 380 230 600 280" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Winglet -->
  <path d="M 620 285 C 640 260, 660 200, 675 140 C 665 145, 645 190, 625 240 Z" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="2"/>

  <!-- Vortex -->
  <ellipse cx="680" cy="135" rx="18" ry="10" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" transform="rotate(-20 680 135)"/>

  <!-- Monochrome Telemetry -->
  <text x="60" y="60" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff" font-weight="bold">AERONAUTICAL AIRFOIL &amp; WINGLET MODEL</text>
  <text x="60" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#86868b">CHORD: 450mm | AoA: +4.2° | DRAG REDUCTION: OPTIMIZED</text>
</svg>
