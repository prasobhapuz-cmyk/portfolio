<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMono5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradMono5)"/>

  <!-- Sun Rays & Vector -->
  <g transform="translate(680, 100)">
    <circle r="40" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="-50" y1="30" x2="-240" y2="150" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>

  <!-- Gimbal Frame -->
  <g transform="translate(380, 310)">
    <rect x="-30" y="50" width="60" height="70" fill="#141416" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="0" cy="50" r="16" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M -15 50 L -30 -10 L 30 -10 L 15 50 Z" fill="#141416" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="0" cy="-10" r="12" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>

    <g transform="rotate(-28)">
      <polygon points="-180,-30 180,-30 150,30 -150,30" fill="rgba(255,255,255,0.06)" stroke="#ffffff" stroke-width="2"/>
      <line x1="-120" y1="-30" x2="-95" y2="30" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <line x1="-60" y1="-30" x2="-45" y2="30" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <line x1="0" y1="-30" x2="5" y2="30" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <line x1="60" y1="-30" x2="55" y2="30" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <line x1="120" y1="-30" x2="105" y2="30" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    </g>
  </g>

  <text x="60" y="60" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff" font-weight="bold">DUAL-AXIS DYNAMIC SOLAR TRACKER</text>
  <text x="60" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#86868b">DYNAMIC AZIMUTH &amp; ELEVATION TRACKING</text>
</svg>
