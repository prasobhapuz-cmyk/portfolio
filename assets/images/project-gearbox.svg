<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMono3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradMono3)"/>

  <!-- Monochrome Planetary Gearset -->
  <g transform="translate(400, 250)">
    <circle r="195" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle r="175" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Carrier Triangle -->
    <polygon points="0,-115 99.6,57.5 -99.6,57.5" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>

    <!-- Sun Gear -->
    <g>
      <circle r="55" fill="#141416" stroke="#ffffff" stroke-width="2"/>
      <circle r="22" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Planet 1 -->
    <g transform="translate(0, -115)">
      <circle r="52" fill="#141416" stroke="#ffffff" stroke-width="2"/>
      <circle r="16" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Planet 2 -->
    <g transform="translate(99.6, 57.5)">
      <circle r="52" fill="#141416" stroke="#ffffff" stroke-width="2"/>
      <circle r="16" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Planet 3 -->
    <g transform="translate(-99.6, 57.5)">
      <circle r="52" fill="#141416" stroke="#ffffff" stroke-width="2"/>
      <circle r="16" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
    </g>
  </g>

  <text x="60" y="60" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff" font-weight="bold">AUTOMOTIVE EPICYCLIC PLANETARY GEARSET</text>
  <text x="60" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#86868b">RATIO: 1:5.4 • COMPACT POWERTRAIN REDUCTION</text>
</svg>
